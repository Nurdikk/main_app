<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Kaspi Digital Documents</title>
    <link rel="stylesheet" href="style.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="app-container">
        <div id="screen-doc" class="screen active">
            <header class="doc-header">
                <div class="back-btn" onclick="location.reload()">‹</div>
                <h1>Удостоверение личности</h1>
            </header>

            <div class="tab-switcher">
                <button class="tab-btn active" id="tab-btn-doc" onclick="switchTab('doc')">Документ</button>
                <button class="tab-btn" id="tab-btn-req" onclick="switchTab('req')">Реквизиты</button>
            </div>

            <div class="tab-wrapper">
                <div id="content-doc" class="tab-pane">
                    <div class="doc-view-area">
                        <label for="upload-input" class="upload-placeholder">
                            <div class="upload-btn-inner">Загрузить</div>
                            <img id="doc-preview" class="preview-img">
                        </label>
                        <input type="file" id="upload-input" accept="image/*" onchange="handleImage(this)">
                    </div>
                    
                    <div class="action-buttons-inline">
                        <button class="btn-primary">Предъявить документ</button>
                        <button class="btn-secondary">Отправить документ</button>
                    </div>
                </div>

                <div id="content-req" class="tab-pane">
                    <div class="requisites-list">
                        <div class="req-item">
                            <label>ФИО</label>
                            <div class="input-row"><input type="text" placeholder="Введите ФИО"><span class="copy-ic">❐</span></div>
                        </div>
                        <div class="req-item">
                            <label>ИИН</label>
                            <div class="input-row"><input type="number" placeholder="Введите ИИН"><span class="copy-ic">❐</span></div>
                        </div>
                        <div class="req-item">
                            <label>Дата рождения</label>
                            <div class="input-row"><input type="text" placeholder="ДД.ММ.ГГГГ"><span class="copy-ic">❐</span></div>
                        </div>
                        <div class="req-item">
                            <label>Номер документа</label>
                            <div class="input-row"><input type="text" placeholder="000000000"><span class="copy-ic">❐</span></div>
                        </div>
                        <div class="req-item">
                            <label>Дата выдачи</label>
                            <div class="input-row"><input type="text" placeholder="ДД.ММ.ГГГГ"><span class="copy-ic">❐</span></div>
                        </div>
                        <div class="req-item">
                            <label>Срок действия</label>
                            <div class="input-row"><input type="text" placeholder="ДД.ММ.ГГГГ"><span class="copy-ic">❐</span></div>
                        </div>
                        <div style="height: 180px;"></div>
                    </div>

                    <div class="action-buttons-fixed">
                        <button class="btn-secondary">Отправить реквизиты</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const docContent = document.getElementById('content-doc');
            const reqContent = document.getElementById('content-req');
            const btnDoc = document.getElementById('tab-btn-doc');
            const btnReq = document.getElementById('tab-btn-req');

            if(type === 'doc') {
                btnDoc.classList.add('active');
                btnReq.classList.remove('active');
                docContent.style.transform = 'translateX(0%)';
                reqContent.style.transform = 'translateX(0%)';
            } else {
                btnReq.classList.add('active');
                btnDoc.classList.remove('active');
                docContent.style.transform = 'translateX(-100%)';
                reqContent.style.transform = 'translateX(-100%)';
            }
        }

        function handleImage(input) {
            const preview = document.getElementById('doc-preview');
            const placeholder = document.querySelector('.upload-btn-inner');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
