<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Kaspi.kz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
    <div class="app-container">
        <header class="doc-header">
            <div class="back-btn" onclick="location.reload()">‹</div>
            <h1>Удостоверение личности</h1>
        </header>

        <div class="tab-switcher-container">
            <div class="tab-switcher">
                <button class="tab-btn active" id="tab-btn-doc" onclick="switchTab('doc')">Документ</button>
                <button class="tab-btn" id="tab-btn-req" onclick="switchTab('req')">Реквизиты</button>
            </div>
        </div>

        <div class="main-content">
            <div class="tab-wrapper">
                <div id="content-doc" class="tab-pane">
                    <div class="doc-card-view">
                        <label for="upload-input" class="upload-area">
                            <div class="upload-text">Нажмите для загрузки удостоверения</div>
                            <img id="doc-preview" class="id-card-img">
                        </label>
                        <input type="file" id="upload-input" accept="image/*" onchange="handleImage(this)">
                    </div>
                </div>

                <div id="content-req" class="tab-pane">
                    <div class="requisites-list">
                        <div class="req-item">
                            <label>ФИО</label>
                            <div class="input-row">
                                <input type="text" value="Емберді Нұрдаулет Ерболұлы">
                                <span class="copy-btn">❐</span>
                            </div>
                        </div>
                        <div class="req-item">
                            <label>ИИН</label>
                            <div class="input-row">
                                <input type="number" value="040604501304">
                                <span class="copy-btn">❐</span>
                            </div>
                        </div>
                        <div class="req-item">
                            <label>Дата рождения</label>
                            <div class="input-row">
                                <input type="text" value="04.06.2004">
                                <span class="copy-btn">❐</span>
                            </div>
                        </div>
                        <div class="req-item">
                            <label>Номер документа</label>
                            <div class="input-row">
                                <input type="text" value="053644685">
                                <span class="copy-btn">❐</span>
                            </div>
                        </div>
                        <div class="req-item">
                            <label>Дата выдачи</label>
                            <div class="input-row">
                                <input type="text" value="23.06.2020">
                                <span class="copy-btn">❐</span>
                            </div>
                        </div>
                        <div class="req-item">
                            <label>Срок действия</label>
                            <div class="input-row">
                                <input type="text" value="22.06.2030">
                                <span class="copy-btn">❐</span>
                            </div>
                        </div>
                        <div style="height: 150px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-actions">
            <div id="actions-doc" class="actions-group active">
                <button class="btn-blue"><img src="qr.png" class="btn-ic"> Предъявить документ</button>
                <button class="btn-white"><img src="share.png" class="btn-ic"> Отправить документ</button>
            </div>
            <div id="actions-req" class="actions-group">
                <button class="btn-white"><img src="share.png" class="btn-ic"> Отправить реквизиты</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const docContent = document.getElementById('content-doc');
            const reqContent = document.getElementById('content-req');
            const actionsDoc = document.getElementById('actions-doc');
            const actionsReq = document.getElementById('actions-req');
            
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-btn-' + type).classList.add('active');

            if(type === 'doc') {
                docContent.style.transform = 'translateX(0%)';
                reqContent.style.transform = 'translateX(0%)';
                actionsDoc.classList.add('active');
                actionsReq.classList.remove('active');
            } else {
                docContent.style.transform = 'translateX(-100%)';
                reqContent.style.transform = 'translateX(-100%)';
                actionsDoc.classList.remove('active');
                actionsReq.classList.add('active');
            }
        }

        function handleImage(input) {
            const preview = document.getElementById('doc-preview');
            const text = document.querySelector('.upload-text');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    text.style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
